</style><style>.tools-panel {
  --tools-paper: #fffdf0;
  --tools-lilac: #d7e5b8;
  --tools-peach: #e9dbac;
  box-sizing: border-box;
  width: 100%;
  max-width: none;
  margin: 0 auto; padding: clamp(17px, 3vw, 32px); background: var(--paper); border: var(--edge); box-shadow: 3px 4px #36433136;
  color: var(--ink, #24202d);
}
.tools-panel [hidden] { display: none !important; }
.tools-header { margin: 0 0 24px; }
.tools-title { margin: 0 0 7px; font-family: var(--pixel); font-size: clamp(1.5rem, 3vw, 2.3rem); font-weight: 400; letter-spacing: -.055em; line-height: 1.04; }
.tools-intro { margin: 0; max-width: 62ch; font-size: 1rem; line-height: 1.5; }
.tools-modes { display: inline-flex; flex-wrap: wrap; gap: 5px; padding: 4px; border: 1.5px solid currentColor; background: var(--tools-paper); border-radius: 0; }
.tools-mode, .tools-nav, .tools-lesson-link {
  appearance: none; min-height: 40px; padding: 8px 14px; color: var(--ink, #24202d);
  font: 650 .81rem/1.3 var(--mono, ui-monospace), monospace; cursor: pointer; border-radius: 0;
}
.tools-mode { border: 1.5px solid transparent; background: transparent; }
.tools-mode[aria-pressed="true"] { border-color: currentColor; background: var(--tools-lilac); }
.tools-mode:hover, .tools-nav:hover:not(:disabled) { background: #e3e8d2; }
.tools-deck-hint { margin: 12px 0; color: #53604e; font: 550 .76rem/1.45 var(--mono, ui-monospace), monospace; }
.tools-stage { max-width: 760px; }
.tools-card {
  box-sizing: border-box; position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between;
  text-align: left; width: calc(100% - 5px); min-height: clamp(240px, 29vw, 320px); padding: clamp(19px, 3.5vw, 37px);
  border: 2px solid var(--ink, #24202d); border-radius: 0; color: var(--ink, #24202d);
  box-shadow: 5px 5px 0 var(--ink, #24202d); background: var(--tools-lilac); cursor: pointer;
}
.tools-card::after { position: absolute; z-index: -1; content: ''; inset: 0; border-radius: inherit; background-image: linear-gradient(#526b3530 1px, transparent 1px), linear-gradient(90deg, #526b3530 1px, transparent 1px); background-size: 13px 13px; mask-image: linear-gradient(110deg,transparent 59%, #000 125%); pointer-events: none; }
.tools-card-back { background: var(--tools-peach); }
.tools-card-meta { display: flex; align-items: center; justify-content: space-between; }
.tools-card-side, .tools-card-number, .tools-card-action, .tools-search-label { font: 650 .8rem/1.3 var(--mono, ui-monospace), monospace; }
.tools-card-side { border: 1.5px solid currentColor; background: var(--tools-paper); border-radius: 0; padding: 5px 8px; }
.tools-card-text { display: block; margin: 25px 0; max-width: 32ch; font-size: clamp(1.55rem,3.3vw,2.35rem); font-weight: 750; line-height: 1.15; letter-spacing: -.035em; }
.tools-card-back .tools-card-text { max-width: 46ch; font-size: clamp(1.26rem,2.6vw,1.78rem); }
.tools-card-action { align-self: flex-start; border-bottom: 1.5px solid currentColor; padding-bottom: 3px; }
.tools-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; }
.tools-nav { min-height: 38px; border: 1.5px solid currentColor; background: var(--tools-paper); }
.tools-nav:disabled { opacity: .42; cursor: default; }
.tools-lesson-link { background: transparent; border: 0; text-decoration: underline; text-underline-offset: 3px; }
.tools-mode:focus-visible, .tools-nav:focus-visible, .tools-card:focus-visible, .tools-lesson-link:focus-visible, .tools-search-field:focus-visible { outline: 3px solid var(--purple, #70429c); outline-offset: 3px; }
.tools-empty { max-width: 65ch; padding: 17px; border: 1.5px dashed var(--ink, #24202d); border-radius: 0; background: var(--tools-paper); line-height: 1.5; }
.tools-empty p { margin: 0 0 10px; }
.tools-search { display: flex; flex-direction: column; max-width: 580px; gap: 6px; }
.tools-search-field { box-sizing: border-box; width: 100%; min-height: 46px; border: 1.5px solid var(--ink, #24202d); border-radius: 0; padding: 10px 13px; font: inherit; font-size: 1rem; color: var(--ink, #24202d); background: var(--tools-paper); }
.tools-terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; margin: 0; }
.tools-term { padding: 17px; border: 1.5px solid var(--ink, #24202d); border-radius: 0; background: var(--tools-paper); }
.tools-term-title { margin: 0 0 7px; font-size: 1.25rem; font-weight: 750; line-height: 1.18; letter-spacing: -.035em; }
.tools-term-body { margin: 0; color: #465343; font-size: .94rem; line-height: 1.5; }
@media (max-width: 480px) {
  .tools-controls { gap: 5px; }
  .tools-lesson-link, .tools-nav { padding-left: 8px; padding-right: 8px; font-size: .72rem; }
  .tools-stage { padding-right: 2px; }
  .tools-header { margin-bottom: 16px; }
}

.tools-nav{box-shadow:inset 2px 2px #fffef1,inset -2px -2px #c6cab3}.tools-mode,.tools-nav{font-weight:700}.tools-nav:disabled{cursor:default}.tools-lesson-link{box-shadow:none}.tools-card{box-shadow:4px 4px #3b49363b,inset 2px 2px #f4f4d6,inset -2px -2px #a6b180}.tools-terms{padding-top:10px}.tools-card-text{font-family:var(--body)}

.topinner { gap: clamp(14px, 2.5vw, 36px) }
.theme-switch {
  display: inline-flex;
  align-items: stretch;
  flex: none;
  margin-left: auto;
  padding: 3px;
  background: #17221d;
  border: 1px solid #768374;
  border-radius: 5px;
}
.theme-switch button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 5px 11px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: #eff3e7;
  white-space: nowrap;
  font: 750 13px/1.15 var(--body);
}
.theme-switch button:hover { background: #ffffff19 }
.theme-switch button[data-theme-choice="minecraft"][aria-pressed="true"] {
  color: #24351a;
  background: #d7eaa9;
  border-color: #e7f6bd;
  box-shadow: inset 0 -2px #a1bc7c;
}
.theme-switch button[data-theme-choice="gta"][aria-pressed="true"] {
  color: #321b37;
  background: linear-gradient(110deg, #ffd193, #ff9fb5);
  border-color: #ffcfb7;
}
.theme-switch button:focus-visible { position: relative; z-index: 1; outline: 3px solid #82f4ef; outline-offset: 1px }
.switch-symbol, .switch-symbol svg { display: block; width: 21px; height: 21px; flex: none }
.topinner .xp { margin-left: 0 }
.guide-name[data-theme-copy] { display: inline; width: auto; height: auto; text-transform: uppercase }
.hero-stats b { font-weight: inherit }
.mission-flag { text-transform: uppercase }

:root[data-theme="gta"] {
  --ink: #2c233b;
  --muted: #585369;
  --paper: #fffdfb;
  --page: #f6efe9;
  --edge: 1px solid #8e8192;
  --purple: #914175;
  --poster: "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
}
[data-theme="gta"] body {
  background: linear-gradient(125deg, #fbefdf 0, #f8efed 53%, #e6f3f0 100%) fixed;
}
[data-theme="gta"] .topbar {
  background: #241d37;
  color: #fff2ea;
  border: 0;
  border-bottom: 3px solid;
  border-image: linear-gradient(90deg, #ffad81, #f271a8 54%, #71d9d0) 1;
  box-shadow: 0 2px 9px #3b234018;
}
[data-theme="gta"] .brand {
  font: italic 900 34px/.95 var(--poster);
  text-transform: uppercase;
  letter-spacing: -.02em;
  text-shadow: 1.5px 1.5px #b44573;
}
[data-theme="gta"] .tabs a { color: #e7dce6; border-radius: 5px }
[data-theme="gta"] .tabs a:hover { background: #383149 }
[data-theme="gta"] .tabs a[aria-current="page"] { background: #45344d; color: #fff4e8; border-color: #986882; box-shadow: none }
[data-theme="gta"] .theme-switch { background: #191629; border-color: #75637f; border-radius: 8px }
[data-theme="gta"] .theme-switch button { border-radius: 5px }
[data-theme="gta"] .xp { background: #1b2635; border-color: #4e8487; color: #a1f5df; border-radius: 20px; padding: 4px 9px }
[data-theme="gta"] .xp svg { width: 17px; height: 17px; fill: #a1f5df35 }
[data-theme="gta"] .skip { background: #ffdab7 }

<script>"use strict";
(() => {
  // sites/rack-pack/dist/lessons.mjs
  var lessons = [
    {
      id: "power-or-compute",
      title: "What are we actually selling?",
      shortTitle: "Power or compute?",
      unit: "The basics",
      minutes: 2,
      intro: "Your friend says, \u201CWe have a megawatt.\u201D That tells you something about electricity. The next question is what a customer can actually use on Monday.",
      sections: [
        { heading: "Follow the power", text: "A megawatt (MW) is 1,000 kilowatts (kW). A data center uses power to run servers and cool them. Some power may already belong to other customers. Ask how much is ready and free at the racks, the frames that hold the machines." },
        { heading: "Find the right customer", text: "A fleet owner with servers of its own can rent powered, cooled rack space. That\u2019s called colocation. A startup that wants to run an AI job needs working GPU servers it can log into. A GPU is a chip that can do lots of calculations at the same time." }
      ],
      example: { heading: "Two calls, one building", text: "A building has empty racks, cooling and internet today. You can show it to someone with servers ready to install. Send a startup with a Friday training deadline to an operator with working machines." },
      question: "Your site has powered racks and zero GPUs. Who could buy what you have today, and what would they bring?",
      rubric: ["Identify a customer that owns or controls servers or GPUs.", "Explain that the customer rents space and power and brings their own hardware."],
      sampleAnswer: "A company that owns GPU servers could rent our powered, cooled racks and bring its machines to install.",
      takeaway: "Sell the thing your customer can take delivery of today."
    },
    {
      id: "meet-the-gpu",
      title: "Can the machines run the job?",
      shortTitle: "Meet the GPU",
      unit: "The basics",
      minutes: 2,
      intro: "Eight GPUs can be a great offer or a terrible fit. What matters is whether the buyer\u2019s software can use those particular chips together.",
      sections: [
        { heading: "The chip, the box and the links", text: "A GPU has memory where it holds data while it works. A node is one server. A cluster is a group of connected servers. When a big model is split across GPUs, those chips may need to exchange data thousands of times during a run." },
        { heading: "Ask what has to fit", text: "Get the GPU model, memory per chip, chips per server and links between them. Then ask the buyer whether the work can be split into independent pieces. Labeling separate photos can often happen on separate machines. Training one large model may need fast links between the chips." }
      ],
      example: { heading: "Eight chips, two layouts", text: "One offer has eight GPUs in one server. Another has eight single-GPU servers in different buildings. The same chip count can give a team very different results." },
      question: "Why might eight GPUs spread across different buildings be a poor fit for training one big model together?",
      rubric: ["Recognize that the GPUs need to exchange information during shared training.", "Explain that slow or distant connections can make the GPUs wait and slow the job."],
      sampleAnswer: "The chips have to share updates while they train the same model. Slow links between buildings can leave them waiting for each other.",
      takeaway: "A GPU count needs a memory size and a map of how the chips connect."
    },
    {
      id: "check-the-supply",
      title: "Which GPUs can you promise?",
      shortTitle: "Check the supply",
      unit: "Make the match",
      minutes: 2,
      intro: "Imagine promising concert tickets because you counted the seats in the room. You still need to know which seats are free and who can sell them. GPU bookings work the same way.",
      sections: [
        { heading: "Get a dated inventory", text: "Ask the operator for the exact GPU model, how many are free together, where they are and the dates a customer can have them. Record installed machines, free machines and future deliveries separately. Ask who owns the servers and who can hold them for your buyer." },
        { heading: "Put a clock on the offer", text: "A price means more when it comes with a hold deadline. Get the price, minimum booking, support contact and time the hold expires in writing. If the buyer needs longer to decide, ask the operator to extend the hold." }
      ],
      example: { heading: "The Tuesday booking", text: "Your friend shows you 32 installed GPUs. A tenant booked 24 for Tuesday. That leaves eight to check for Tuesday, even though the building still contains all 32." },
      question: "Of 32 installed GPUs, 24 are booked Tuesday. How many could you offer then, and what would make the offer firm?",
      rubric: ["State that at most eight GPUs could be available on Tuesday.", "Ask the authorized operator to confirm or hold the remaining GPUs for the buyer\u2019s time window, ideally in writing."],
      sampleAnswer: "At most eight. I\u2019d ask the operator who controls bookings to confirm the eight are usable together on Tuesday and hold them until an agreed deadline.",
      takeaway: "A firm offer names the hardware, dates, owner and hold deadline."
    },
    {
      id: "find-the-buyer",
      title: "Who has a job they can move?",
      shortTitle: "Find the buyer",
      unit: "Make the match",
      minutes: 2,
      intro: "An AI startup can spend a fortune and still have nothing it can run on your machines. Start with the last job its engineers actually ran.",

      const passed = isPassed(l.id);

      return '<a class="map-link' + (selected ? " current" : "") + '" href="#lesson/' + l.id + '" title="' + esc(label) + '" aria-label="' + esc(label) + '"' + (selected ? ' aria-current="step"' : "") + '><span class="keyhint" aria-hidden="true">' + (i + 1) + '</span><span class="slot-art" data-theme-art="slot-' + i + '" aria-hidden="true"></span><span class="slot-name">' + slotLabels[i] + "</span>" + (passed ? '<span class="slot-check" aria-hidden="true">' + ic("check") + "</span>" : "") + "</a>";
    }).join("");
    refreshTheme($("map-nav"));
    refreshTheme($("xp-count"));
    updateNote();
  }
  function openLesson(id) {
    if (idx(id) < 0)
      return;
    const hash = "#lesson/" + id;
    if (location.hash === hash)
      $("study-panel").scrollIntoView({ block: "start" });
    else
      location.hash = hash;
  }
  function setNote() {
    const el = $("mode-note");
    if (!el)
      return;
    el.textContent = mode === "device" ? "Your browser\u2019s installed AI checks the answer on this device." : mode === "download" ? "First use downloads a large AI model. Requires WebGPU and about 1.9 GB of GPU memory. Your answer stays on this device." : "Puter receives your answer. Sign in to use your own AI allowance. Charges can apply.";
    const b = $("grade");
    if (b && !running)
      b.innerHTML = ic("bolt") + (mode === "download" ? "Load model & check answer" : "Check my answer");
  }
  function applyMode() {
    const sel = $("grade-mode");
    if (!sel)
      return;
    const options = [["cloud", "Cloud AI \xB7 Puter"], ...detected ? [["device", "Installed browser AI"]] : [], ...navigator.gpu ? [["download", "Download on-device AI"]] : []];
    if (!options.some((o) => o[0] === mode))
      mode = "cloud";
    sel.innerHTML = options.map((o) => '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
    sel.value = mode;
    setNote();
  }
  function feedback(id) {
    const box = $("feedback"), r = progress[id]?.latest;
    if (!box)
      return;
    if (!r) {
      box.replaceChildren();
      return;
    }
    const lesson = lessons[idx(id)], label = r.score === 2 ? '<span data-theme-copy="passed"></span>' : r.score === 1 ? "Halfway there" : "Try that one again";
    box.innerHTML = '<div class="feedback ' + (r.score === 2 ? "passed" : "") + '"><strong>' + label + " \xB7 " + r.score + "/2</strong><p>" + esc(r.feedback) + '</p><p class="cue">' + esc(r.tip) + "</p>" + (r.score === 2 ? '<div class="example-answer"><p><b>Takeaway</b> ' + esc(lesson.takeaway) + "</p></div>" : "") + "</div>";
    refreshTheme(box);
  }
  function paintGradeLock() {
    const b = $("grade");
    if (!b)
      return;
    b.disabled = Boolean(running);
    $("grade-mode").disabled = Boolean(running);
    if (running) {
      b.textContent = running === active?.id ? "Checking\u2026" : "One check in progress";
      if (running === active?.id)
        $("quiz-status").textContent = runStatus;
    } else
      setNote();
  }
  async function submitGrade(e) {
    e.preventDefault();
    if (running || !active)
      return;
    const l = active, a = $("answer").value.trim(), target = $("quiz-status");
    if (!a) {
      target.textContent = "Write your answer first.";
      $("answer").focus();
      return;
    }
    drafts[l.id] = a;
    save();
    running = l.id;
    runStatus = "Starting your check\u2026";
    paintGradeLock();
    try {
      const r = await gradeAnswer(l, a, { mode, onStatus: (s) => {
        runStatus = s;
        if (active?.id === l.id && $("quiz-status"))
          $("quiz-status").textContent = s;
      } });
      const previous = progress[l.id] || {};
      progress[l.id] = { bestScore: Math.max(previous.bestScore || 0, r.score), latest: r, lastAnswer: a };
      save();
      updateMap();
      if (active?.id === l.id && currentView === "learn") {
        feedback(l.id);
        $("quiz-status").textContent = r.score === 2 ? "Full credit saved. You can move to the next lesson." : "You can edit your answer and try again.";
      }
    } catch (err) {
      if (active?.id === l.id && $("quiz-status"))
        $("quiz-status").textContent = err?.message || "The AI could not finish. Your answer is saved for another try.";
    } finally {
      running = null;
      runStatus = "";
      paintGradeLock();
    }
  }
  function showLesson(l) {
    const i = idx(l.id);
    const sectionText = l.sections.map((s) => `<section class="lesson-par"><h3>${esc(s.heading)}</h3><p>${esc(s.text)}</p></section>`).join("");
    const previous = i ? `<a href="#lesson/${lessons[i - 1].id}">${ic("back")} <span data-theme-copy="previous"></span></a>` : "";
    const next = i < lessons.length - 1 ? `<a class="btn secondary next-link" href="#lesson/${lessons[i + 1].id}"><span data-theme-copy="next"></span> ${ic("forward")}</a>` : `<a class="btn secondary next-link" href="#flashcards">Review flashcards ${ic("forward")}</a>`;
    $("study-panel").innerHTML = `<article class="panel lesson">
   <div class="lesson-ribbon"><span class="mission-flag">${ic("flag")} <span data-theme-copy="unit"></span> ${num(i + 1)}</span><span class="ribbon-dot"></span><span>${esc(l.unit.toUpperCase())}</span><span class="readtime">${ic("time")} ${l.minutes} min read</span></div>
   <div class="lesson-inner"><h2 tabindex="-1">${esc(l.title)}</h2><p class="intro">${esc(l.intro)}</p><div id="activity"></div>${sectionText}
     <aside class="worked"><strong>${ic("star")} ${esc(l.example.heading)}</strong><p>${esc(l.example.text)}</p></aside>
   </div>
   <form class="quiz" id="quiz"><div class="quiz-kicker"><span data-theme-art="checkpoint" aria-hidden="true"></span> <span data-theme-copy="checkpoint"></span></div>
     <h3 id="question">${esc(l.question)}</h3><label class="answer-label" for="answer">Your answer \xB7 1\u20133 sentences</label><textarea id="answer" maxlength="2500" aria-describedby="question" placeholder="Explain it in your own words\u2026"></textarea>
     <div class="quiz-options"><label for="grade-mode">Grade with</label><select id="grade-mode"></select><p id="mode-note" class="mode-note"></p></div>
     <div class="actions"><button class="btn" id="grade" type="submit">${ic("bolt")}Check my answer</button></div>
     <p class="quiz-status" role="status" id="quiz-status"></p><div id="feedback" aria-live="polite"></div>
   </form>
 </article><nav class="lesson-bottom" aria-label="Lesson navigation">${previous}${next}</nav>`;
    mountActivity($("activity"), l, i);
    refreshTheme($("study-panel"));
    applyMode();
    feedback(l.id);
    paintGradeLock();
    const answer = $("answer");
    answer.value = drafts[l.id] ?? progress[l.id]?.lastAnswer ?? "";
    answer.addEventListener("input", () => {
      drafts[l.id] = answer.value;
      save();
    });
    $("quiz").addEventListener("focusin", () => {
      if (mode === "cloud")
        void prepareGrader();
    });
    $("grade-mode").addEventListener("change", (e) => {
      mode = e.target.value;
      save();
      setNote();
      if (mode === "cloud")
        void prepareGrader();
    });
    $("quiz").addEventListener("submit", submitGrade);
  }
  function route() {
    const parts = location.hash.slice(1).split("/");
    const view = ["flashcards", "glossary"].includes(parts[0]) ? parts[0] : "learn";
    const old = currentView;
    currentView = view;
    document.body.classList.toggle("aux", view !== "learn");
    document.querySelectorAll("[data-tab]").forEach((a) => a.dataset.tab === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    if (view === "learn") {
      const selected = parts[0] === "lesson" && idx(parts[1]) >= 0 ? parts[1] : idx(last) >= 0 ? last : lessons[0].id;
      active = lessons[idx(selected)];
      last = selected;
      save();
      showLesson(active);
    } else {
      active = null;
      renderTools($("study-panel"), view, { lessons, openLesson, progress });
    }
    updateMap();
    if (!firstRender && view === "learn" && parts[0] === "lesson")
      $("study-panel").scrollIntoView({ behavior: "instant", block: "start" });
    else if (view !== old && !firstRender)
      window.scrollTo({ top: 0, behavior: "instant" });
    firstRender = false;
  }
  $("hero-stats").innerHTML = "<span>" + ic("book") + '<b data-theme-copy="count"></b></span><span>' + ic("time") + "16 min read</span><span>" + ic("chat") + "AI quizzes</span>";
  initializeThemes();
  $("copy-site").innerHTML = ic("link") + "Share bootcamp";
  $("copy-site").addEventListener("click", async () => {
    if (location.protocol === "file:") {
      $("toast").textContent = "Share the Rack-Pack-Bootcamp.html file with a teammate.";
      setTimeout(() => {
        $("toast").textContent = "";
      }, 5e3);
      return;
    }
    let msg = "Bootcamp link copied.";
    const url = location.href.split("#")[0];
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      if (navigator.share) {
        try {
          await navigator.share({ url, title: "Rack Pack \xB7 Compute Broker Bootcamp" });
        } catch {
        }
        return;
      }
      msg = "Copy this link: " + url;
    }
    $("toast").textContent = msg;
    setTimeout(() => {
      $("toast").textContent = "";
    }, 5e3);
  });
  $("map-nav").addEventListener("click", (event) => {
    const link = event.target.closest("a");
    if (link && location.hash === link.hash)
      $("study-panel").scrollIntoView({ block: "start" });
  });
  window.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || event.repeat || event.isComposing || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey)
      return;
    if (event.target?.closest?.('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))
      return;
    const slot = Number(event.key);
    if (!/^[1-8]$/.test(event.key) || !lessons[slot - 1])
      return;
    event.preventDefault();
    openLesson(lessons[slot - 1].id);
  });
  window.addEventListener("hashchange", route);
  route();
  selectGradeMode().then((preferred) => {
    detected = preferred === "device";
    if (!start.mode && detected)
      mode = "device";
    if (currentView === "learn")
      applyMode();
  });
})();
</script></body></html>
