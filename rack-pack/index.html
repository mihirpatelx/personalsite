<script>"use strict";
(() => {
  // sites/rack-pack/dist/lessons.mjs
  var lessons = [
    {
      id: "power-or-compute",
      title: "What are we actually selling?",
      shortTitle: "Power or compute?",
      unit: "The basics",
      minutes: 2,
      intro: "Your friend says, \u201CWe have a megawatt.\u201D That tells you something about electricity. The next question is what a customer can actually use on Monday.",
      sections: [
        { heading: "Follow the power", text: "A megawatt (MW) is 1,000 kilowatts (kW). A data center uses power to run servers and cool them. Some power may already belong to other customers. Ask how much is ready and free at the racks, the frames that hold the machines." },
        { heading: "Find the right customer", text: "A fleet owner with servers of its own can rent powered, cooled rack space. That\u2019s called colocation. A startup that wants to run an AI job needs working GPU servers it can log into. A GPU is a chip that can do lots of calculations at the same time." }
      ],
      example: { heading: "Two calls, one building", text: "A building has empty racks, cooling and internet today. You can show it to someone with servers ready to install. Send a startup with a Friday training deadline to an operator with working machines." },
      question: "Your site has powered racks and zero GPUs. Who could buy what you have today, and what would they bring?",
      rubric: ["Identify a customer that owns or controls servers or GPUs.", "Explain that the customer rents space and power and brings their own hardware."],
      sampleAnswer: "A company that owns GPU servers could rent our powered, cooled racks and bring its machines to install.",
      takeaway: "Sell the thing your customer can take delivery of today."
    },
    {
      id: "meet-the-gpu",
      title: "Can the machines run the job?",
      shortTitle: "Meet the GPU",
      unit: "The basics",
      minutes: 2,
      intro: "Eight GPUs can be a great offer or a terrible fit. What matters is whether the buyer\u2019s software can use those particular chips together.",
      sections: [
        { heading: "The chip, the box and the links", text: "A GPU has memory where it holds data while it works. A node is one server. A cluster is a group of connected servers. When a big model is split across GPUs, those chips may need to exchange data thousands of times during a run." },
        { heading: "Ask what has to fit", text: "Get the GPU model, memory per chip, chips per server and links between them. Then ask the buyer whether the work can be split into independent pieces. Labeling separate photos can often happen on separate machines. Training one large model may need fast links between the chips." }
      ],
      example: { heading: "Eight chips, two layouts", text: "One offer has eight GPUs in one server. Another has eight single-GPU servers in different buildings. The same chip count can give a team very different results." },
      question: "Why might eight GPUs spread across different buildings be a poor fit for training one big model together?",
      rubric: ["Recognize that the GPUs need to exchange information during shared training.", "Explain that slow or distant connections can make the GPUs wait and slow the job."],
      sampleAnswer: "The chips have to share updates while they train the same model. Slow links between buildings can leave them waiting for each other.",
      takeaway: "A GPU count needs a memory size and a map of how the chips connect."

    $("study-panel").innerHTML = '<article class="panel lesson"><div class="lesson-ribbon"><span class="mission-flag">' + ic("flag") + " QUEST " + num(i + 1) + '</span><span class="ribbon-dot"></span><span>' + esc(l.unit.toUpperCase()) + '</span><span class="readtime">' + ic("time") + " " + l.minutes + ' min read</span></div><div class="lesson-inner"><h2 tabindex="-1">' + esc(l.title) + '</h2><p class="intro">' + esc(l.intro) + '</p><div id="activity"></div>' + l.sections.map((s) => '<section class="lesson-par"><h3>' + esc(s.heading) + "</h3><p>" + esc(s.text) + "</p></section>").join("") + '<aside class="worked"><strong>' + ic("star") + " " + esc(l.example.heading) + "</strong><p>" + esc(l.example.text) + '</p></aside></div><form class="quiz" id="quiz"><div class="quiz-kicker">' + torch + ' Crafting checkpoint</div><h3 id="question">' + esc(l.question) + '</h3><label class="answer-label" for="answer">Your answer \xB7 1\u20133 sentences</label><textarea id="answer" maxlength="2500" aria-describedby="question" placeholder="Explain it in your own words\u2026"></textarea><div class="quiz-options"><label for="grade-mode">Grade with</label><select id="grade-mode"></select><p id="mode-note" class="mode-note"></p></div><div class="actions"><button class="btn" id="grade" type="submit">' + ic("bolt") + 'Check my answer</button></div><p class="quiz-status" role="status" id="quiz-status"></p><div id="feedback" aria-live="polite"></div></form></article><nav class="lesson-bottom" aria-label="Quest navigation">' + (i ? '<a href="#lesson/' + lessons[i - 1].id + '">' + ic("back") + " Previous quest</a>" : "") + (i < lessons.length - 1 ? '<a class="btn secondary next-link" href="#lesson/' + lessons[i + 1].id + '">Next quest ' + ic("forward") + "</a>" : '<a class="btn secondary next-link" href="#flashcards">Review flashcards ' + ic("forward") + "</a>") + "</nav>";
    mountActivity($("activity"), l, i);
    applyMode();
    feedback(l.id);
    paintGradeLock();
    const answer = $("answer");
    answer.value = drafts[l.id] ?? progress[l.id]?.lastAnswer ?? "";
    answer.addEventListener("input", () => {
      drafts[l.id] = answer.value;
      save();
    });
    $("quiz").addEventListener("focusin", () => {
      if (mode === "cloud")
        void prepareGrader();
    });
    $("grade-mode").addEventListener("change", (e) => {
      mode = e.target.value;
      save();
      setNote();
      if (mode === "cloud")
        void prepareGrader();
    });
    $("quiz").addEventListener("submit", submitGrade);
  }
  function route() {
    const parts = location.hash.slice(1).split("/");
    const view = ["flashcards", "glossary"].includes(parts[0]) ? parts[0] : "learn";
    const old = currentView;
    currentView = view;
    document.body.classList.toggle("aux", view !== "learn");
    document.querySelectorAll("[data-tab]").forEach((a) => a.dataset.tab === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    if (view === "learn") {
      const selected = parts[0] === "lesson" && idx(parts[1]) >= 0 ? parts[1] : idx(last) >= 0 ? last : lessons[0].id;
      active = lessons[idx(selected)];
      last = selected;
      save();
      showLesson(active);
    } else {
      active = null;
      renderTools($("study-panel"), view, { lessons, openLesson, progress });
    }
    updateMap();
    if (!firstRender && view === "learn" && parts[0] === "lesson")
      $("study-panel").scrollIntoView({ behavior: "instant", block: "start" });
    else if (view !== old && !firstRender)
      window.scrollTo({ top: 0, behavior: "instant" });
    firstRender = false;
  }
  $("brand-icon").innerHTML = mark;
  $("tag-book").innerHTML = book;
  $("hero-stats").innerHTML = "<span>" + ic("book") + "8 quests</span><span>" + ic("time") + "16 min read</span><span>" + ic("chat") + "AI quizzes</span>";
  $("copy-site").innerHTML = ic("link") + "Share bootcamp";
  $("copy-site").addEventListener("click", async () => {
    if (location.protocol === "file:") {
      $("toast").textContent = "Share the Rack-Pack-Bootcamp.html file with a teammate.";
      setTimeout(() => {
        $("toast").textContent = "";
      }, 5e3);
      return;
    }
    let msg = "Bootcamp link copied.";
    const url = location.href.split("#")[0];
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      if (navigator.share) {
        try {
          await navigator.share({ url, title: "Rack Pack \xB7 Compute Broker Bootcamp" });
        } catch {
        }
        return;
      }
      msg = "Copy this link: " + url;
    }
    $("toast").textContent = msg;
    setTimeout(() => {
      $("toast").textContent = "";
    }, 5e3);
  });
  $("map-nav").addEventListener("click", (event) => {
    const link = event.target.closest("a");
    if (link && location.hash === link.hash)
      $("study-panel").scrollIntoView({ block: "start" });
  });
  window.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || event.repeat || event.isComposing || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey)
      return;
    if (event.target?.closest?.('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))
      return;
    const slot = Number(event.key);
    if (!/^[1-8]$/.test(event.key) || !lessons[slot - 1])
      return;
    event.preventDefault();
    openLesson(lessons[slot - 1].id);
  });
  window.addEventListener("hashchange", route);
  route();
  selectGradeMode().then((preferred) => {
    detected = preferred === "device";
    if (!start.mode && detected)
      mode = "device";
    if (currentView === "learn")
      applyMode();
  });
})();
</script></body></html>
